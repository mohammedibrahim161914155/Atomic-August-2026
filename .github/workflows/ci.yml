# Atomic — Continuous Integration
# Runs on every push and pull request to the main branch.
# Pipeline: dependency install -> type check -> lint -> test suite -> production build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts,.tsx --max-warnings=0

      - name: Test suite
        run: npm test
        env:
          # The test suite never calls a real LLM — it mocks the provider layer.
          # A non-placeholder key is still required by config validation.
          OPENROUTER_API_KEY: sk-or-test-ci-key-must-be-at-least-24-chars-long

      - name: Production build
        run: npm run build

      - name: Sanity-check server start (smoke test)
        run: |
          timeout 15 node dist/server.js || true
